<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#343a44"/>
      <stop offset="1" stop-color="#1b1f26"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12171c"/>
      <stop offset="1" stop-color="#090c10"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <filter id="blueGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="38" height="38" patternUnits="userSpaceOnUse">
      <rect x="4" y="4" width="23" height="23" rx="5" fill="#283039"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#080a0e"/>
  <ellipse cx="800" cy="810" rx="650" ry="55" fill="#000" opacity=".55"/>

  <g filter="url(#shadow)">
    <rect x="38" y="55" width="1524" height="750" rx="88" fill="url(#case)" stroke="#4a515c" stroke-width="5"/>
    <rect x="70" y="90" width="1460" height="680" rx="60" fill="#15191f" stroke="#0b0e12" stroke-width="8"/>

    <rect x="104" y="310" width="70" height="240" rx="35" fill="#0b78eb" stroke="#58b8ff" stroke-width="5"
          filter="url(#blueGlow)"/>
    <rect x="118" y="333" width="18" height="190" rx="9" fill="#49baff" opacity=".58"/>

    <rect x="230" y="115" width="1260" height="630" rx="35" fill="url(#screen)" stroke="#59616d" stroke-width="6"/>
    <rect x="250" y="135" width="1220" height="590" rx="24" fill="none" stroke="#222a33" stroke-width="3"/>
  </g>

  <g font-family="'JetBrains Mono','SFMono-Regular',Menlo,monospace">
    <rect x="286" y="174" width="24" height="24" rx="6" fill="#9dfb3b"/>
    <text x="328" y="198" fill="#a7ff45" font-size="42" font-weight="800" letter-spacing="2">RUNNING</text>

    <g transform="translate(1120 170)">
      <rect x="0" y="1" width="19" height="46" rx="5" fill="#e9e9ef"/>
      <rect x="30" y="-5" width="19" height="52" rx="5" fill="#e9e9ef"/>
      <rect x="60" y="-13" width="19" height="60" rx="5" fill="#e9e9ef"/>
    </g>

    <text x="285" y="433" fill="#f7f9fb" font-size="194" font-weight="500" letter-spacing="-15">15:56</text>
    <text x="835" y="385" fill="#a9b1bd" font-size="102" font-weight="400">26</text>

    <text x="300" y="530" fill="#f3f5f8" font-size="48" font-weight="700">JUL 26</text>
    <line x1="522" y1="509" x2="675" y2="509" stroke="#68717d" stroke-width="7" stroke-linecap="round"/>
    <text x="730" y="530" fill="#f3f5f8" font-size="46" font-weight="650">Sunday</text>

    <g transform="translate(1192 244)" font-size="37" font-weight="800">
      <rect width="105" height="57" rx="12" fill="#91e82e"/>
      <text x="18" y="41" fill="#17210b">RUN</text>
      <text x="135" y="42" fill="#b5f86a">12</text>

      <rect y="82" width="105" height="57" rx="12" fill="#a99af7"/>
      <text x="10" y="123" fill="#211a4b">WAIT</text>
      <text x="135" y="124" fill="#8d96a2">0</text>

      <rect y="164" width="105" height="57" rx="12" fill="#4cbdf8"/>
      <text x="18" y="205" fill="#09263d">FIN</text>
      <text x="135" y="206" fill="#8d96a2">26</text>
    </g>

    <text x="287" y="600" fill="#77818d" font-size="24" letter-spacing="2">7D WEEKLY</text>
    <text x="1383" y="600" fill="#a7ff45" font-size="26" text-anchor="end">64%</text>

