        <rect x="1126" y="627" width="23" height="23" rx="5"/><rect x="1164" y="627" width="23" height="23" rx="5"/>
      </g>
      <!-- Cyan row -->
      <g fill="#45bfff">
        <rect x="290" y="665" width="23" height="23" rx="5"/><rect x="328" y="665" width="23" height="23" rx="5"/>
        <rect x="366" y="665" width="23" height="23" rx="5"/><rect x="404" y="665" width="23" height="23" rx="5"/>
        <rect x="442" y="665" width="23" height="23" rx="5"/><rect x="480" y="665" width="23" height="23" rx="5"/>
